const UI_TRANSLATIONS=[["График / График","График","График"],["минут / минут","минут","минут"],["мин / мин","мин","мин"],["Бұл — тақырыптарға бөлінген 1000 қазақша сөз. Жиілік бойынша жасалған рейтинг емес. Алдымен отбасы, мектеп және тұрмыс сөздері, кейін іс-әрекеттер мен күрделірек ұғымдар беріледі. Көп қолданылатын кірме сөздер де бар. Көпмағыналы сөздердің негізгі мағыналары көрсетілген. / Это тематический учебный набор из 1000 разных казахских слов, а не статистический рейтинг частотности. Сначала — семья, школа и быт; затем действия и более сложные понятия. Включены общеупотребительные заимствования. У многозначных слов приведены основные учебные значения.","Бұл — тақырыптарға бөлінген 1000 қазақша сөз. Жиілік бойынша жасалған рейтинг емес. Алдымен отбасы, мектеп және тұрмыс сөздері, кейін іс-әрекеттер мен күрделірек ұғымдар беріледі. Көп қолданылатын кірме сөздер де бар. Көпмағыналы сөздердің негізгі мағыналары көрсетілген.","Это тематический учебный набор из 1000 разных казахских слов, а не статистический рейтинг частотности. Сначала — семья, школа и быт; затем действия и более сложные понятия. Включены общеупотребительные заимствования. У многозначных слов приведены основные учебные значения."],["Жеке HTML файлы — қосымшаның сақтық көшірмесі. Оның ішінде барлық сөздер мен сурет бар. JavaScript қолдайтын браузер қажет. Кейбір телефондардағы файлды алдын ала қарау режимі қосымшаны іске қоспайды. / Самостоятельный HTML-файл — резервная копия приложения. Он содержит все слова и иллюстрацию; для работы требуется браузер с поддержкой JavaScript. Предпросмотр файлов на некоторых телефонах не запускает приложение.","Жеке HTML файлы — қосымшаның сақтық көшірмесі. Оның ішінде барлық сөздер мен сурет бар. JavaScript қолдайтын браузер қажет. Кейбір телефондардағы файлды алдын ала қарау режимі қосымшаны іске қоспайды.","Самостоятельный HTML-файл — резервная копия приложения. Он содержит все слова и иллюстрацию; для работы требуется браузер с поддержкой JavaScript. Предпросмотр файлов на некоторых телефонах не запускает приложение."],["Нәтижелер браузерде сақталады. Деректерді тазалау, жеке режим, басқа браузер немесе HTML файлын жылжыту сақтауға әсер етуі мүмкін. Көшірмені мезгіл-мезгіл жүктеп алып отырыңыз. / Он сохраняется в браузере. Очистка данных, приватный режим, другой браузер или перемещение HTML-файла могут повлиять на сохранение. Рекомендуем периодически скачивать копию.","Нәтижелер браузерде сақталады. Деректерді тазалау, жеке режим, басқа браузер немесе HTML файлын жылжыту сақтауға әсер етуі мүмкін. Көшірмені мезгіл-мезгіл жүктеп алып отырыңыз.","Он сохраняется в браузере. Очистка данных, приватный режим, другой браузер или перемещение HTML-файла могут повлиять на сохранение. Рекомендуем периодически скачивать копию."],["Деректер осы браузердің localStorage жадында, файл кешінен бөлек сақталады. Басқа телефонмен синхрондалмайды. Сайт деректерін тазалау тарихты өшіруі мүмкін. / Данные хранятся в localStorage этого браузера, отдельно от кеша файлов. С телефоном родителя не синхронизируются. Очистка данных сайта может удалить историю.","Деректер осы браузердің localStorage жадында, файл кешінен бөлек сақталады. Басқа телефонмен синхрондалмайды. Сайт деректерін тазалау тарихты өшіруі мүмкін.","Данные хранятся в localStorage этого браузера, отдельно от кеша файлов. С телефоном родителя не синхронизируются. Очистка данных сайта может удалить историю."],["Пайыз тек алғашқы жауаппен есептеледі. Сабақта соңғы аяқталған тесттің бағасы көрсетіледі. Бұрынғы ең жоғары баға соңғы баға болып саналмайды. / Процент считается по первой попытке. У урока показан последний завершённый тест. Старый максимум не выдаётся за последнюю оценку.","Пайыз тек алғашқы жауаппен есептеледі. Сабақта соңғы аяқталған тесттің бағасы көрсетіледі. Бұрынғы ең жоғары баға соңғы баға болып саналмайды.","Процент считается по первой попытке. У урока показан последний завершённый тест. Старый максимум не выдаётся за последнюю оценку."],["Safari немесе басқа браузерде. Нәтижелер құрылғыда сақталады. Басқа құрылғыға көшіру үшін осы бөлімдегі JSON көшірмесін қолданыңыз. / в Safari или другом браузере. Прогресс хранится на устройстве. Для переноса используйте копию JSON из этого раздела.","Safari немесе басқа браузерде. Нәтижелер құрылғыда сақталады. Басқа құрылғыға көшіру үшін осы бөлімдегі JSON көшірмесін қолданыңыз.","в Safari или другом браузере. Прогресс хранится на устройстве. Для переноса используйте копию JSON из этого раздела."],["Карточкалар мен тесттердегі уақыт қана есептеледі. Жасырын қойынды және 60 секунд әрекетсіздіктен кейінгі уақыт есептелмейді. / Считается время в карточках и тестах. Скрытая вкладка и время после 60 секунд без действий не учитываются.","Карточкалар мен тесттердегі уақыт қана есептеледі. Жасырын қойынды және 60 секунд әрекетсіздіктен кейінгі уақыт есептелмейді.","Считается время в карточках и тестах. Скрытая вкладка и время после 60 секунд без действий не учитываются."],["Аударма сөздің астында ашылады. Қате жауаптан кейін тағы таңдауға немесе келесі сұраққа өтуге болады. / Перевод открывается под словом. После ошибки можно попробовать ещё или перейти дальше.","Аударма сөздің астында ашылады. Қате жауаптан кейін тағы таңдауға немесе келесі сұраққа өтуге болады.","Перевод открывается под словом. После ошибки можно попробовать ещё или перейти дальше."],["Сабақты аяқтау үшін 20 сұрақтың 16-сына дұрыс жауап беру керек. Карточкаларды қарап, тағы байқап көр. / Чтобы пройти урок, нужно 16 из 20. Посмотри карточки ещё раз и попробуй снова.","Сабақты аяқтау үшін 20 сұрақтың 16-сына дұрыс жауап беру керек. Карточкаларды қарап, тағы байқап көр.","Чтобы пройти урок, нужно 16 из 20. Посмотри карточки ещё раз и попробуй снова."],["${ui('Үш деңгейдің әрқайсысында 100 сабақ, 1000 бірлік бар. Барлық деңгей ашық. Бірліктер — сөздер мен қысқа тіркестер. Тестте 15 сұрақ, екі бағыт та бар.','Три свободных уровня по 100 уроков и 1000 учебных единиц. Единицы — слова и короткие фразы. В тесте 15 вопросов в обоих направлениях.')}","Барлық 100 сабақ ашық. Әр сабақта 10 сөз, тестте 15 сұрақ бар. Екі бағыт та кездеседі.","Все 100 уроков доступны. В уроке 10 слов, в тесте 15 вопросов в обоих направлениях."],["Аударманы ересек адамға тексерт. Қосқан сөздерің тек осы құрылғыда сақталады. / Попроси взрослого проверить перевод. Свои слова сохраняются только на этом устройстве.","Аударманы ересек адамға тексерт. Қосқан сөздерің тек осы құрылғыда сақталады.","Попроси взрослого проверить перевод. Свои слова сохраняются только на этом устройстве."],["Бұл шамамен есеп. Құрылғы кенет өшсе, соңғы секундтар сақталмауы мүмкін. / Это приблизительный учёт. При аварийном выключении последние секунды могут не сохраниться.","Бұл шамамен есеп. Құрылғы кенет өшсе, соңғы секундтар сақталмауы мүмкін.","Это приблизительный учёт. При аварийном выключении последние секунды могут не сохраниться."],["Сақтау мүмкін болмады. «Ата-анаға» бөлімінен көшірмені жүктеп ал. / Не удалось сохранить на устройстве. Скачай резервную копию в разделе «Для родителей».","Сақтау мүмкін болмады. «Ата-анаға» бөлімінен көшірмені жүктеп ал.","Не удалось сохранить на устройстве. Скачай резервную копию в разделе «Для родителей»."],[". ${ui('Кейбір аудармалар мен грамматика дереккөздермен салыстырылды. Барлық 3000 бірлік тәуелсіз тіл редакторының толық тексеруінен өткен жоқ.','Переводы и грамматика выборочно сверены по источникам. Полная независимая языковая редактура всех 3000 единиц не проводилась.')}",". Барлық 1000 аударма тәуелсіз редактордың толық тексеруінен өткен жоқ.","Полная независимая редакторская проверка всех 1000 переводов не проводилась."],["Барлық 1000 аударма тәуелсіз редактордың толық тексеруінен өткен жоқ. / Полная независимая редакторская проверка всех 1000 переводов не проводилась.","Барлық 1000 аударма тәуелсіз редактордың толық тексеруінен өткен жоқ.","Полная независимая редакторская проверка всех 1000 переводов не проводилась."],["Ескі тест сеансы карточкалардан жалғасады; оқу нәтижелері сақталады. / Старый сеанс теста продолжается с карточек; накопленный прогресс сохраняется.","Ескі тест сеансы карточкалардан жалғасады; оқу нәтижелері сақталады.","Старый сеанс теста продолжается с карточек; накопленный прогресс сохраняется."],["Атың осы құрылғыда ғана сақталады. Бұрынғы оқу нәтижелері өзгермейді. / Имя сохраняется только на этом устройстве. Прежний прогресс останется.","Атың осы құрылғыда ғана сақталады. Бұрынғы оқу нәтижелері өзгермейді.","Имя сохраняется только на этом устройстве. Прежний прогресс останется."],["Қайталау: келесі күні, сәтті қайталасаң — үш күннен соң. / Повторение: на следующий день, после успешного повторения — через три дня.","Қайталау: келесі күні, сәтті қайталасаң — үш күннен соң.","Повторение: на следующий день, после успешного повторения — через три дня."],["Бұл сөздің бірнеше мағынасы бар. Олар / белгісімен бөлінген. / У этого слова несколько значений. Они показаны через косую черту.","Бұл сөздің бірнеше мағынасы бар. Олар / белгісімен бөлінген.","У этого слова несколько значений. Они показаны через косую черту."],["Есеп осы жаңартудан басталады. Бұрынғы уақыт қосылмайды. / Учёт начинается с этого обновления. Прошлое время не добавляется.","Есеп осы жаңартудан басталады. Бұрынғы уақыт қосылмайды.","Учёт начинается с этого обновления. Прошлое время не добавляется."],["Әр сабақта 10 сөз бар. Келесі сабақ біртіндеп ашылады. / По 10 слов в уроке. Следующая ступень открывается постепенно.","Әр сабақта 10 сөз бар. Келесі сабақ біртіндеп ашылады.","По 10 слов в уроке. Следующая ступень открывается постепенно."],["Сақтау мүмкін емес. «Ата-анаға» бөлімінен көшірме ал. / Сохранение недоступно. Скачай копию в разделе для родителей.","Сақтау мүмкін емес. «Ата-анаға» бөлімінен көшірме ал.","Сохранение недоступно. Скачай копию в разделе для родителей."],["Бұл тек атын өзгертеді. Нәтижелер мен тарих сақталады. / Меняется только имя. Прогресс и история остаются.","Бұл тек атын өзгертеді. Нәтижелер мен тарих сақталады.","Меняется только имя. Прогресс и история const KEY='aruzhan-kazakh-v1',app=document.getElementById('app');

function validateState(s){if(!s||s.version!==1||!Array.isArray(s.custom)||s.custom.length>5000)throw Error('Файл жарамсыз / Некорректный файл');let seen=new Set();let ids=new Set();for(const w of s.custom){if(!w||typeof w.id!=='string'||!/^c[\w-]+$/.test(w.id)||ids.has(w.id)||typeof w.kk!=='string'||typeof w.ru!=='string'||!w.kk.trim()||!w.ru.trim()||w.kk.length>100||w.ru.length>200||seen.has(norm(w.kk)))throw Error('Сөздер қате не қайталанған / Некорректные или повторные слова');seen.add(norm(w.kk));ids.add(w.id)}const all=new Set([...LESSONS.flatMap(l=>l.words).map(w=>w.id),...ids]);for(const k of ['errors','learned'])if(!Array.isArray(s[k])||s[k].some(id=>!all.has(id)))throw Error('Оқу нәтижелері жарамсыз / Некорректный прогресс');if(!Array.isArray(s.completed)||s.completed.some(i=>!Number.isInteger(i)||i<0||i>=LESSONS.length))throw Error('Сабақ деректері жарамсыз / Некорректные уроки');if(!s.best||!s.due||typeof s.best!=='object'||typeof s.due!=='object')throw Error('Нәтижелер жарамсыз / Некорректные результаты');const clean=emptyState();clean.level=[0,1,2].includes(s.level)?s.level:0;clean.uiLanguage=s.uiLanguage==='ru'?'ru':'kk';clean.profileName=cleanName(s.profileName);if(s.activity&&typeof s.activity==='object'){if(Number.isFinite(s.activity.since)&&s.activity.since>0)clean.activity.since=s.activity.since;if(s.activity.days&&typeof s.activity.days==='object')for(const [key,value] of Object.entries(s.activity.days)){if(/^\d{4}-\d{2}-\d{2}$/.test(key)&&dayKey(new Date(key+'T12:00:00').getTime())===key&&Number.isFinite(value)&&value>0&&value<=86400000)clean.activity.days[key]=Math.floor(value)}}clean.custom=s.custom;clean.errors=[...new Set(s.errors)];clean.learned=[...new Set(s.learned)];clean.completed=[...new Set(s.completed)];for(let i=0;i<LESSONS.length;i++)if(Number.isFinite(s.best[i])&&s.best[i]>=0&&s.best[i]<=20)clean.best[i]=s.best[i];for(let i=0;i<LESSONS.length;i++){const r=s.last?.[i];if(r&&r.total===15&&Number.isInteger(r.correct)&&r.correct>=0&&r.correct<=15)clean.last[i]={correct:r.correct,total:15}}for(const id of all)if(Number.isFinite(s.due[id]))clean.due[id]=s.due[id];return clean}
const BASE_WORDS=LESSONS.flatMap(l=>l.words),WORD_BY_ID=new Map(BASE_WORDS.map(w=>[w.id,w]));

function validSession(s){if(!s)return false;const all=new Set(allWords().map(w=>w.id));if(!['cards','quiz','result'].includes(s.mode)||!Array.isArray(s.ids)||!s.ids.length||s.ids.length>10||new Set(s.ids).size!==s.ids.length||s.ids.some(id=>!all.has(id))||!Number.isInteger(s.pos)||s.pos<0||!Number.isInteger(s.lesson)||s.lesson< -1||s.lesson>=LESSONS.length)return false;if(s.mode==='cards')return s.pos<s.ids.length;if(s.quizVersion!==2)return false;if(!Array.isArray(s.questions)||s.questions.length!==15||s.questions.some(q=>!s.ids.includes(q.id)||![0,1].includes(q.dir))||s.pos>15||!Array.isArray(s.first)||s.first.length>15||s.first.some(id=>!all.has(id))||!Array.isArray(s.tries)||s.tries.some(id=>!all.has(id))||typeof s.solved!=='boolean'||!Number.isInteger(s.correct)||s.correct!==s.questions.reduce((n,q,i)=>n+(s.first[i]===q.id?1:0),0))return false;if(s.first.length!==s.pos+(s.pos<15&&s.first[s.pos]!==undefined?1:0))return false;if(s.options!==null&&(!Array.isArray(s.options)||s.options.length!==4||s.options.some(id=>!all.has(id))))return false;return s.mode!=='result'||s.pos===15}

function startReview(ids,title){if(!ids.length){flash('Мұнда әзірге сөз жоқ. Келесі сабақты бастай аласың! / Здесь пока пусто. Можно начать следующий урок!');return}state.session={mode:'cards',lesson:-1,title,ids:ids.slice(0,10),pos:0,flipped:false};save();renderSession()}
function sessionTitle(s){return s.lesson>=0?levelName(Math.floor(s.lesson/100))+' · '+lessonTitle(LESSONS[s.lesson]):ui('Қайталау','Повторение')}
function renderSession(){if(!state.session){home();return}const s=state.session;if(s.mode==='cards')cards();else if(s.mode==='quiz')quiz();else result()}
function fitCardText(){for(const id of ['cardText','cardTranslation']){const el=document.getElementById(id);if(!el||!el.parentElement?.clientHeight)continue;const box=el.parentElement;el.style.fontSize='36px';for(let size=36;size>14&&(el.scrollHeight>box.clientHeight-12||el.scrollWidth>box.clientWidth-12);size-=2)el.style.fontSize=(size-2)+'px'}}
function cards(){const s=state.session,w=word(s.ids[s.pos]);view(`<p class="stage">${esc(sessionTitle(s))} · ${s.pos+1} / ${s.ids.length}</p><progress max="${s.ids.length}" value="${s.pos+1}" aria-label="Карточкалар / Карточки"></progress><div class="mascotSlot" style="visibility:${s.pos%3===0?'visible':'hidden'}"><img decoding="async" src="${HERO}" alt=""><span>Бірге үйренеміз / Учимся вместе</span></div><div class="study-card"><button id="cardFace" class="flashcard" aria-describedby="cardHelp" aria-expanded="${!!s.flipped}"><span class="cardHalf"><span id="cardText" lang="kk">${esc(w.kk)}</span></span><span class="cardHalf translationHalf ${s.flipped?'revealed':''}" id="translationHalf" aria-hidden="${!s.flipped}"><span id="cardTranslation" lang="ru">${esc(w.ru)}</span></span></button><button id="flip" class="wide" aria-controls="translationHalf" aria-expanded="${!!s.flipped}">${s.flipped?'Жасыру / Скрыть перевод':'Аударма / Показать перевод'}</button></div><div class="row cardNav"><button id="back" ${s.pos===0?'disabled':''}>Артқа / Назад</button><button id="next" class="primary">${s.pos===s.ids.length-1?'Тестке / К тесту':'Келесі / Далее'}</button></div><p id="cardHelp" class="muted compactHelp">Карточканы бас / Нажми на карточку</p>`,'cards');const flip=()=>{s.flipped=!s.flipped;document.getElementById('translationHalf').classList.toggle('revealed',s.flipped);document.getElementById('translationHalf').setAttribute('aria-hidden',String(!s.flipped));document.getElementById('cardFace').setAttribute('aria-expanded',String(s.flipped));document.getElementById('flip').setAttribute('aria-expanded',String(s.flipped));document.getElementById('flip').textContent=tr(s.flipped?'Жасыру / Скрыть перевод':'Аударма / Показать перевод');save()};on('cardFace',flip);on('flip',flip);on('back',()=>{s.pos--;s.flipped=false;save();cards()});on('next',()=>{if(s.pos===s.ids.length-1)beginQuiz();else{s.pos++;s.flipped=false;save();cards()}});fitCardText()}

function beginQuiz(){const s=state.session;Object.assign(s,{mode:'quiz',quizVersion:2,questions:makeQuestions(s.ids),pos:0,correct:0,first:[],tries:[],solved:false,options:null});save();quiz()}
function meanings(w){return w.ru.split(' / ').map(x=>norm(x.replace(/\([^)]*\)/g,'')))}
function optionsFor(q){const w=word(q.id),mw=meanings(w),level=w.lesson<0?state.level:Math.floor(w.lesson/100);const candidates=shuffle(BASE_WORDS.filter(x=>Math.floor(x.lesson/100)===level&&x.id!==w.id&&!meanings(x).some(v=>mw.includes(v))));const used=new Set([q.dir?w.kk:w.ru]),choices=[w.id];for(const x of candidates){const label=q.dir?x.kk:x.ru;if(!used.has(label)){choices.push(x.id);used.add(label)}if(choices.length===4)break}return shuffle(choices)}
function quiz(){const s=state.session;if(s.pos>=15){finish();return}const q=s.questions[s.pos],w=word(q.id);if(!s.options){s.options=optionsFor(q);save()}view(`<p class="stage">${esc(sessionTitle(s))} · ${s.pos+1} / 15</p><progress max="15" value="${s.pos}" aria-label="Тест"></progress><div class="card quizCard"><p class="quizInstruction">${q.dir?'Қазақша таңда / Выбери на казахском':'Орысша таңда / Выбери на русском'}</p><div class="quizPrompt" lang="${q.dir?'ru':'kk'}">${esc(q.dir?w.ru:w.kk)}</div><div class="quizResponse"><div class="grid quizChoices">${s.options.map(id=>{const tried=s.tries.includes(id),right=tried&&id===q.id;return `<button class="answer ${tried?(right?'answerRight':'answerWrong'):''}" data-answer="${id}" ${s.solved||tried?'disabled':''} lang="${q.dir?'kk':'ru'}">${tried?`<span aria-label="${right?'Дұрыс / Верно':'Қате / Неверно'}">${right?'✓':'✕'}</span> `:''}${esc(q.dir?word(id).kk:word(id).ru)}</button>`}).join('')}</div></div><p class="attemptStatus" role="status">${s.solved?'✓':s.tries.length?'Тағы таңда / Попробуй ещё':'Жауапты таңда / Выбери ответ'}</p></div><button id="continue" class="primary wide" ${s.first[s.pos]===undefined?'disabled':''}>Келесі / Далее</button><button id="toWords" class="wide">↩ Сөздерге / К словам урока</button>`,'quiz');app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.answer));on('continue',nextQuestion);on('toWords',()=>{s.mode='cards';s.pos=0;s.flipped=false;save();cards()})}



function answer(id){const s=state.session;if(s.mode!=='quiz'||s.solved||!s.options.includes(id)||s.tries.includes(id))return;const q=s.questions[s.pos];if(s.first[s.pos]===undefined){s.first[s.pos]=id;if(id===q.id)s.correct++;else if(!state.errors.includes(q.id))state.errors.push(q.id)}s.tries.push(id);s.solved=id===q.id;save();quiz()}
function finish(){const s=state.session;if(s.mode==='result'){result();return}s.mode='result';for(const id of s.ids){const indices=s.questions.map((q,i)=>q.id===id?i:-1).filter(i=>i>=0);if(!indices.length)continue;if(indices.every(i=>s.first[i]===id)){state.errors=state.errors.filter(x=>x!==id);if(!state.learned.includes(id))state.learned.push(id);state.due[id]=Date.now()+(s.lesson===-1?3:1)*86400000}else{state.learned=state.learned.filter(x=>x!==id);if(!state.errors.includes(id))state.errors.push(id)}}if(s.lesson>=0){state.last[s.lesson]={correct:s.correct,total:15};if(!state.completed.includes(s.lesson))state.completed.push(s.lesson)}save();result()}
function result(){const s=state.session;view(`<div class="card center"><div class="mascotSlot"><img decoding="async" src="${HERO}" alt=""><span>Нәтиже / Результат</span></div><h1>${Math.round(s.correct/15*100)}%</h1><p>${s.correct} / 15</p><p>Тек алғашқы жауап есептеледі. / Считается только первая попытка.</p><div class="row"><button id="again">Қайта / Ещё тест</button><button id="done" class="primary">Дайын / Готово</button></div><button id="resultWords">Сөздерге / К словам</button></div>`,'result');on('again',beginQuiz);on('resultWords',()=>{s.mode='cards';s.pos=0;s.flipped=false;save();cards()});on('done',()=>{state.session=null;save();home()})}
function dictionary(){view(`<h1>${ui('Сөздік','Словарь')}</h1><p>3000 ${ui('оқу бірлігі','учебных единиц')} · ${ui('Өз сөздерім','Мои слова')}: ${state.custom.length}</p><label for="search">${ui('Сөзді немесе тіркесті іздеу','Найти слово или фразу')}</label><input id="search" type="search" placeholder="${ui('Мысалы: ортақ мақсат','Например: общая цель')}"><div id="wordlist"></div><details><summary>${ui('Өз сөзіңді қосу','Добавить своё слово')}</summary><p>${ui('Аударманы ересек адамға тексерт. Деректер осы құрылғыда сақталады.','Попроси взрослого проверить перевод. Данные хранятся на этом устройстве.')}</p><form id="addForm"><label for="kk">${ui('Қазақша','На казахском')}</label><input id="kk" maxlength="100" required lang="kk"><label for="ru">${ui('Орысша аудармасы','Перевод на русский')}</label><input id="ru" maxlength="200" required><p id="formError" role="alert"></p><button class="primary" type="submit">${ui('Қосу','Добавить')}</button></form></details><button id="customPractice">${ui('Өз сөздерімді үйрену','Учить мои слова')} · ${state.custom.length}</button>`,'dictionary');const search=document.getElementById('search'),list=document.getElementById('wordlist');let page=0;function draw(){const q=norm(search.value),matches=allWords().filter(w=>norm(w.kk+' '+w.ru).includes(q)),pages=Math.max(1,Math.ceil(matches.length/100));page=Math.min(page,pages-1);list.innerHTML=`<p class="muted">${ui('Табылды','Найдено')}: ${matches.length} · ${page+1}/${pages}</p><table><tbody>${matches.slice(page*100,(page+1)*100).map(w=>`<tr><td lang="kk">${esc(w.kk)}</td><td lang="ru">${esc(w.ru)}</td></tr>`).join('')}</tbody></table><div class="dictionaryPages"><button id="dictPrev" ${page===0?'disabled':''}>${ui('Артқа','Назад')}</button><button id="dictNext" ${page===pages-1?'disabled':''}>${ui('Келесі','Далее')}</button></div>`;on('dictPrev',()=>{page--;draw();list.scrollTop=0});on('dictNext',()=>{page++;draw();list.scrollTop=0})}search.oninput=()=>{page=0;draw()};draw();document.getElementById('addForm').onsubmit=e=>{e.preventDefault();const kk=document.getElementById('kk').value.trim(),ru=document.getElementById('ru').value.trim(),error=document.getElementById('formError');if(!kk||!ru){error.textContent=ui('Екі жолды да толтыр.','Заполни оба поля.');return}if(allWords().some(w=>norm(w.kk)===norm(kk))){error.textContent=ui('Бұл сөз немесе тіркес бар.','Такое слово или фраза уже есть.');return}if(state.custom.length>=5000){error.textContent=ui('Шек: 5000 сөз.','Предел: 5000 своих слов.');return}state.custom.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2),kk,ru,lesson:-1});save();dictionary();flash(ui('Сөз қосылды!','Слово добавлено!'))};on('customPractice',()=>startReview(shuffle(state.custom.map(w=>w.id)),'Өз сөздерім / Мои слова'))}
function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function parents(){activityTick();save();view(`<h1>Ата-анаға / Для родителей</h1>${activitySection()}${profileSettings()}<details><summary>Қалай үйренеміз? / Как заниматься</summary><p>Барлық 100 сабақ ашық. Әр сабақта 10 сөз, тестте 15 сұрақ бар. Екі бағыт та кездеседі. / Все 100 уроков доступны. В уроке 10 слов, в тесте 15 вопросов в обоих направлениях.</p><p>Аударма сөздің астында ашылады. Қате жауаптан кейін тағы таңдауға немесе келесі сұраққа өтуге болады. / Перевод открывается под словом. После ошибки можно попробовать ещё или перейти дальше.</p><p>Пайыз тек алғашқы жауаппен есептеледі. Сабақта соңғы аяқталған тесттің бағасы көрсетіледі. Бұрынғы ең жоғары баға соңғы баға болып саналмайды. / Процент считается по первой попытке. У урока показан последний завершённый тест. Старый максимум не выдаётся за последнюю оценку.</p><p>Ескі тест сеансы карточкалардан жалғасады; оқу нәтижелері сақталады. / Старый сеанс теста продолжается с карточек; накопленный прогресс сохраняется.</p><p>Қайталау: келесі күні, сәтті қайталасаң — үш күннен соң. / Повторение: на следующий день, после успешного повторения — через три дня.</p></details><div class="card"><h2>Осы құрылғыдағы оқу нәтижелері / Прогресс на этом устройстве</h2><p>Нәтижелер браузерде сақталады. Деректерді тазалау, жеке режим, басқа браузер немесе HTML файлын жылжыту сақтауға әсер етуі мүмкін. Көшірмені мезгіл-мезгіл жүктеп алып отырыңыз. / Он сохраняется в браузере. Очистка данных, приватный режим, другой браузер или перемещение HTML-файла могут повлиять на сохранение. Рекомендуем периодически скачивать копию.</p><button id="export" class="primary wide">Нәтижелер мен өз сөздерімді жүктеп алу / Скачать прогресс и свои слова</button><label for="import">Көшірмеден қалпына келтіру (.json) / Восстановить из копии (.json)</label><input id="import" type="file" accept=".json,application/json"><p id="importStatus" role="status"></p><button id="confirmImport" hidden>Қазіргі нәтижелерді осы көшірмемен ауыстыру / Заменить текущий прогресс этой копией</button></div><div class="card"><h2>Сөздік туралы / О словаре</h2><p>${ui('Негізгі деңгейдің 1000 сөзі өзгермеді. Орта деңгейде тұрмыс, мектеп, табиғат және қысқа сөйлемдер бар. Күрделі деңгейде зерттеу, мәтінді түсіну, нақты сипаттау және пайымдау беріледі. Деңгейлер шартты, CEFR емес.','Базовые 1000 слов сохранены без изменений. Средний уровень: быт, школа, природа и короткие фразы. Сложный: исследования, понимание текста, точное описание и рассуждение. Уровни учебные, без сертификации CEFR.')}</p><p>Кейбір сөздер тексерілген дереккөздер: / Выборочная сверка: <a href="https://sozdikqor.kz/soz?a=S%C4%B0%C5%83L%C4%B0&id=177941" target="_blank" rel="noopener">Sozdikqor: сіңлі</a>; <a href="https://www.soyle.kz/upload/orig/article/347676_1467047604.pdf" target="_blank" rel="noopener">Soyle: көкөністер мен жемістер / Soyle: овощи и фрукты</a>; <a href="https://e-history.kz/ru/kazakhstanika/show/10783" target="_blank" rel="noopener">Сырнай</a>. Барлық 1000 аударма тәуелсіз редактордың толық тексеруінен өткен жоқ. / Полная независимая редакторская проверка всех 1000 переводов не проводилась.</p></div><details><summary>Телефонда қалай ашуға болады / Как открыть на телефоне</summary><p>Ашыңыз: / Откройте <a href="https://rustemarenov-source.github.io/aruzhan-kazakh/">қосымшаның сілтемесі / приложение по ссылке</a> Safari немесе басқа браузерде. Нәтижелер құрылғыда сақталады. Басқа құрылғыға көшіру үшін осы бөлімдегі JSON көшірмесін қолданыңыз. / в Safari или другом браузере. Прогресс хранится на устройстве. Для переноса используйте копию JSON из этого раздела.</p><p>Жеке HTML файлы — қосымшаның сақтық көшірмесі. Оның ішінде барлық сөздер мен сурет бар. JavaScript қолдайтын браузер қажет. Кейбір телефондардағы файлды алдын ала қарау режимі қосымшаны іске қоспайды. / Самостоятельный HTML-файл — резервная копия приложения. Он содержит все слова и иллюстрацию; для работы требуется браузер с поддержкой JavaScript. Предпросмотр файлов на некоторых телефонах не запускает приложение.</p></details>`,'parents');bindActivityControls();bindProfileSettings();on('export',()=>{activityTick();save();download('aruzhan-progress.json',JSON.stringify(state,null,2),'application/json')});let pending=null;document.getElementById('import').onchange=async e=>{const file=e.target.files[0],msg=document.getElementById('importStatus'),btn=document.getElementById('confirmImport');btn.hidden=true;pending=null;if(!file)return;try{if(file.size>3000000)throw Error('Файл тым үлкен / Файл слишком большой');pending=validateState(JSON.parse(await file.text()));msg.textContent=tr(`Көшірмеде: / В копии: ${pending.completed.length} сабақ, / уроков, ${pending.custom.length} өз сөзің бар. Қазіргі деректер ауыстырылады. / своих слов. Текущие данные будут заменены.`);btn.hidden=false}catch(err){msg.textContent=tr('Көшірмені оқу мүмкін болмады: / Не удалось прочитать копию: '+err.message)}};on('confirmImport',()=>{if(pending){state=pending;if(tracker){tracker.last=Date.now();tracker.lastInput=Date.now();tracker.active=false;tracker.wasActive=false;tracker.dirty=false}save();home();flash('Оқу нәтижелері қалпына келтірілді. / Прогресс восстановлен.')}})}
function difficulty(i){return levelName(Math.floor(i/100))}
function makeQuestions(ids){const shuffled=shuffle(ids),primary=shuffled.map((id,i)=>({id,dir:i%2}));let pool=shuffle(primary.concat(shuffle(primary.map(q=>({id:q.id,dir:1-q.dir}))).slice(0,Math.max(0,15-primary.length))));while(pool.length<15)pool.push(...shuffle(ids.flatMap(id=>[{id,dir:0},{id,dir:1}])).slice(0,15-pool.length));return shuffle(pool.slice(0,15))}
function nextQuestion(){const s=state.session;if(s.first[s.pos]===undefined)return;s.pos++;s.tries=[];s.solved=false;s.options=null;save();quiz()}
function restoreSession(s){if(validSession(s))return s;if(s&&s.quizVersion!==2&&['quiz','result'].includes(s.mode)){const cards={mode:'cards',lesson:s.lesson,ids:s.ids,pos:0,flipped:false};if(validSession(cards))return cards}return null}
function ui(kk,ru){return state.uiLanguage==='ru'?ru:kk}
function levelName(n){return [ui('Негізгі','Базовый'),ui('Орта','Средний'),ui('Күрделі','Сложный')][n]}
function lessonTitle(l){const parts=l.title.split(' / ');return state.uiLanguage==='ru'?parts[1]||parts[0]:parts[0]}
function levelPicker(){return `<div class="levelPicker" role="group" aria-label="${ui('Деңгей таңдау','Выбор уровня')}">${[0,1,2].map(i=>`<button data-level="${i}" aria-pressed="${state.level===i}">${levelName(i)}</button>`).join('')}</div>`}
function bindLevels(){app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{state.level=+b.dataset.level;save();if(app.dataset.screen==='lessons')lessonsView();else home()})}
function currentLevelWords(){return BASE_WORDS.filter(w=>Math.floor(w.lesson/100)===state.level)}
function tr(value){let text=String(value);const ru=state.uiLanguage==='ru';for(const [both,kk,russian] of UI_TRANSLATIONS)text=text.split(both).join(ru?russian:kk);return text}
function localizeUI(root){if(!document.createTreeWalker)return;const walker=document.createTreeWalker(root,4);let n;while(n=walker.nextNode()){if(!n.parentElement.closest('#cardText,#cardTranslation,.quizPrompt,.answer,#wordlist,.profileGreeting'))n.nodeValue=tr(n.nodeValue)}for(const el of root.querySelectorAll('[aria-label],[placeholder],[alt]'))for(const attr of ['aria-label','placeholder','alt'])if(el.hasAttribute(attr))el.setAttribute(attr,tr(el.getAttribute(attr)))}
function updateHeader(){document.documentElement.lang=state.uiLanguage==='ru'?'ru':'kk';document.title=(state.profileName?state.profileName+' — ':'')+(state.uiLanguage==='ru'?'Казахские слова':'Қазақша сөздер');document.getElementById('brand').textContent=(state.uiLanguage==='ru'?'Слова':'Сөз')+(state.profileName?' · '+state.profileName:'');document.getElementById('homeBtn').textContent=state.uiLanguage==='ru'?'⌂ Главная':'⌂ Басты бет';for(const lang of ['kk','ru'])document.getElementById('lang-'+lang).setAttribute('aria-pressed',String(state.uiLanguage===lang));document.getElementById('footer').textContent=state.uiLanguage==='ru'?'3000 единиц · 300 уроков':'3000 бірлік · 300 сабақ'}
function switchLanguage(lang){if(!['kk','ru'].includes(lang)||state.uiLanguage===lang)return;state.uiLanguage=lang;save();updateHeader();const screen=app.dataset.screen;if(screen==='parents')parents();else if(screen==='dictionary')dictionary();else if(screen==='lessons')lessonsView();else if(['cards','quiz','result'].includes(screen))renderSession();else home()}
function dayKey(ms){const d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addActiveInterval(start,end){while(end>start){const d=new Date(start),boundary=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime(),stop=Math.min(end,boundary),key=dayKey(start);state.activity.days[key]=Math.min(86400000,(state.activity.days[key]||0)+stop-start);start=stop;tracker.dirty=true}}
function activityTick(now=Date.now()){if(!tracker)return;const gap=now-tracker.last;if(tracker.active&&tracker.visible&&gap>0&&gap<=15000){const end=Math.min(now,tracker.lastInput+60000);if(end>tracker.last)addActiveInterval(tracker.last,end)}tracker.last=now}
function activityScreen(screen){if(!tracker)return;activityTick();tracker.active=['cards','quiz'].includes(screen);if(tracker.active&&!tracker.wasActive)tracker.lastInput=Date.now();tracker.wasActive=tracker.active}
function noteActivity(){activityTick();tracker.lastInput=Date.now()}
function activityVisibility(){activityTick();tracker.visible=document.visibilityState!=='hidden';tracker.last=Date.now();if(tracker.visible)tracker.lastInput=Date.now();save()}
function activityPagehide(){activityTick();save();tracker.visible=false}
function activityPageshow(){tracker.visible=document.visibilityState!=='hidden';tracker.last=Date.now();tracker.lastInput=Date.now()}
function dateLabel(key){return key.split('-').reverse().join('.')}
function minutes(ms){return (ms/60000).toLocaleString(state.uiLanguage==='ru'?'ru-RU':'kk-KZ',{minimumFractionDigits:1,maximumFractionDigits:1})}
function activitySection(){const total=Object.values(state.activity.days).reduce((a,b)=>a+b,0),days=[];const now=new Date();for(let i=activityPeriod-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);const key=dayKey(d.getTime());days.push({key,ms:state.activity.days[key]||0})}const max=Math.max(60000,...days.map(d=>d.ms));const present=days.filter(d=>d.ms>0);return `<section class="card activityCard"><h2>${tr('Белсенділік / Активность')}</h2><p class="activityTotal">${tr('Барлығы / Всего')}: <strong>${minutes(total)} ${tr('минут / минут')}</strong> · ${(total/3600000).toLocaleString(state.uiLanguage==='ru'?'ru-RU':'kk-KZ',{maximumFractionDigits:2})} ${tr('сағ / ч')}</p><div class="activityControls"><button id="period7" aria-pressed="${activityPeriod===7}">7 ${tr('күн / дней')}</button><button id="period30" aria-pressed="${activityPeriod===30}">30 ${tr('күн / дней')}</button><button id="activityChart" aria-pressed="${activityMode==='chart'}">${tr('График / График')}</button><button id="activityList" aria-pressed="${activityMode==='list'}">${tr('Тізім / Список')}</button></div>${present.length?activityMode==='chart'?`<div class="activityChart" role="img" aria-label="${tr('Күндер бойынша белсенді минуттар / Активные минуты по датам')}">${days.map((d,i)=>`<div class="activityColumn" title="${esc(dateLabel(d.key))}: ${minutes(d.ms)} ${tr('мин / мин')}"><span class="barValue">${activityPeriod===7?minutes(d.ms):''}</span><div class="barTrack"><span style="height:${d.ms?Math.max(2,d.ms/max*100):0}%"></span></div><small>${activityPeriod===7||i%5===0||i===days.length-1?new Date(d.key+'T12:00:00').getDate():''}</small></div>`).join('')}</div><p class="compactHelp">${esc(dateLabel(days[0].key))} — ${esc(dateLabel(days[days.length-1].key))} · ${tr('минут / минут')}</p>`:`<table class="activityTable"><thead><tr><th>${tr('Күні / Дата')}</th><th>${tr('Минут / Минуты')}</th></tr></thead><tbody>${present.reverse().map(d=>`<tr><td>${esc(dateLabel(d.key))}</td><td>${minutes(d.ms)}</td></tr>`).join('')}</tbody></table>`:`<p>${tr('Бұл кезеңде белсенді уақыт әлі жоқ. / За этот период активное время ещё не записано.')}</p>`}<details><summary>${tr('Уақыт қалай есептеледі? / Как считается время')}</summary><p>${tr('Есеп осы жаңартудан басталады. Бұрынғы уақыт қосылмайды. / Учёт начинается с этого обновления. Прошлое время не добавляется.')} ${tr('Басталған күні / Дата начала')}: ${dateLabel(dayKey(state.activity.since))}.</p><p>${tr('Карточкалар мен тесттердегі уақыт қана есептеледі. Жасырын қойынды және 60 секунд әрекетсіздіктен кейінгі уақыт есептелмейді. / Считается время в карточках и тестах. Скрытая вкладка и время после 60 секунд без действий не учитываются.')}</p><p>${tr('Бұл шамамен есеп. Құрылғы кенет өшсе, соңғы секундтар сақталмауы мүмкін. / Это приблизительный учёт. При аварийном выключении последние секунды могут не сохраниться.')}</p><p>${tr('Деректер осы браузердің localStorage жадында, файл кешінен бөлек сақталады. Басқа телефонмен синхрондалмайды. Сайт деректерін тазалау тарихты өшіруі мүмкін. / Данные хранятся в localStorage этого браузера, отдельно от кеша файлов. С телефоном родителя не синхронизируются. Очистка данных сайта может удалить историю.')}</p></details></section>`}
function bindActivityControls(){on('period7',()=>{activityPeriod=7;parents()});on('period30',()=>{activityPeriod=30;parents()});on('activityChart',()=>{activityMode='chart';parents()});on('activityList',()=>{activityMode='list';parents()})}
function cleanName(value){return String(value||'').replace(/[\u0000-\u001f\u007f]/g,'').trim().slice(0,40)}
function onboarding(){view(`<div class="card"><h1>${tr('Атың кім? / Как тебя зовут?')}</h1><p>${tr('Тек атыңды жаз. / Напиши только имя.')}</p><form id="nameForm"><label for="childName">${tr('Аты / Имя')}</label><input id="childName" maxlength="40" autocomplete="off" required><p id="nameError" role="alert"></p><button type="submit" class="primary wide">${tr('Бастау / Начать')}</button></form><p class="compactHelp">${tr('Атың осы құрылғыда ғана сақталады. Бұрынғы оқу нәтижелері өзгермейді. / Имя сохраняется только на этом устройстве. Прежний прогресс останется.')}</p></div>`,'onboarding');document.getElementById('nameForm').onsubmit=e=>{e.preventDefault();const name=cleanName(document.getElementById('childName').value);if(!name){document.getElementById('nameError').textContent=tr('Атыңды жаз. / Введи имя.');return}state.profileName=name;save();updateHeader();home()}}
function profileSettings(){return `<section class="card"><h2>${tr('Осы профильдің аты / Имя текущего профиля')}</h2><p>${tr('Бұл тек атын өзгертеді. Нәтижелер мен тарих сақталады. / Меняется только имя. Прогресс и история остаются.')}</p><form id="profileForm"><label for="profileName">${tr('Аты / Имя')}</label><input id="profileName" maxlength="40" value="${esc(state.profileName)}" autocomplete="off" required><p id="profileStatus" role="status"></p><button type="submit">${tr('Атын сақтау / Сохранить имя')}</button></form></section>`}
function bindProfileSettings(){document.getElementById('profileForm').onsubmit=e=>{e.preventDefault();const name=cleanName(document.getElementById('profileName').value);if(!name){document.getElementById('profileStatus').textContent=tr('Атыңды жаз. / Введи имя.');return}state.profileName=name;save();updateHeader();document.getElementById('profileName').value=name;document.getElementById('profileStatus').textContent=tr('Аты сақталды. Нәтижелер өзгерген жоқ. / Имя сохранено. Прогресс не изменился.')}}

tracker={last:Date.now(),lastInput:Date.now(),active:false,wasActive:false,visible:document.visibilityState!=='hidden',dirty:false,lastSave:Date.now()};
if(document.addEventListener){for(const event of ['pointerdown','keydown','touchstart','scroll'])document.addEventListener(event,noteActivity,{capture:true,passive:true});document.addEventListener('visibilitychange',activityVisibility)}
if(window.addEventListener){window.addEventListener('resize',fitCardText);window.addEventListener('pagehide',activityPagehide);window.addEventListener('pageshow',activityPageshow)}
if(typeof setInterval==='function')setInterval(()=>{activityTick();if(tracker.dirty&&Date.now()-tracker.lastSave>=15000)save()},5000);
on('lang-kk',()=>switchLanguage('kk'));on('lang-ru',()=>switchLanguage('ru'));
document.getElementById('homeBtn').onclick=home;home();
</script></body></html>
