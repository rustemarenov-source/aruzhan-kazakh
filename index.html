function stage(i){return ['Алғашқы сөздер / Первые слова','Менің күнім / Мой день','Айналамыздағы әлем / Мир вокруг','Іс-әрекет және қарым-қатынас / Дела и общение','Көбірек білемін / Умею больше'][Math.floor(i/20)]}
function home(){let next=nextLesson(),due=state.learned.filter(id=>(state.due[id]||0)<=Date.now());view(`<div class="hero"><img decoding="async" src="${HERO}" alt="Қазақтың ұлттық киімін киген ойдан шығарылған қыз / Вымышленная девочка в казахском национальном наряде"><div class="heroText"><h1>Сәлем, Аружан!<small class="helloRu">Привет, Аружан!</small></h1><p>10 сөз — бір жеңіс / 10 слов — маленькая победа</p></div></div>${!storageOK?'<p class="notice compactHelp">Сақтау мүмкін емес. «Ата-анаға» бөлімінен көшірме ал. / Сохранение недоступно. Скачай копию в разделе для родителей.</p>':''}<div class="card homeProgress"><div class="row"><span class="stat">${state.completed.length}<small> / 100</small></span><span>сабақ аяқталды / уроков пройдено</span></div><progress max="100" value="${state.completed.length}" aria-label="Аяқталған сабақтар / Пройдено уроков"></progress><p class="compactHelp">Меңгерген сөздер: / Закреплено слов: ${state.learned.length}</p>${state.session?'<button id="resume" class="primary wide">Жалғастыру / Продолжить</button>':next>=0?`<p class="compactHelp">Сабақ / Урок  ${next+1} · ${esc(LESSONS[next].title)}</p><button id="start" class="primary wide">Бастау / Начать · 10</button>`:'<p class="compactHelp">Барлық сабақ аяқталды. Сөздерді қайталап жүр! / Все уроки пройдены. Продолжай повторять!</p>'}</div><div class="grid homeMenu"><button id="errors">Қателер / Ошибки · ${state.errors.length}</button><button id="due">Қайталау / Повторить · ${due.length}</button><button id="lessons">Сабақтар / Уроки</button><button id="dictionary">Сөздік / Словарь</button></div><button id="parents" class="wide parentLink">Ата-анаға / Для родителей</button>`,'home');on('start',()=>startLesson(next));on('resume',renderSession);on('errors',()=>startReview(state.errors,'Қателерді түзетеміз / Повторяем ошибки'));on('due',()=>startReview(due,'Сөздерді еске түсіреміз / Вспоминаем слова'));on('lessons',lessonsView);on('dictionary',dictionary);on('parents',parents)}

function lessonsView(){view(`<h1>Сабақтар / Уроки</h1><p>Барлығы ашық / Все доступны · 10 сөз / слов</p><p class="compactHelp">Қиындық шартты / Сложность условная, не CEFR</p><div class="list">${LESSONS.map((l,i)=>{const r=state.last[i],pct=r?Math.round(r.correct/r.total*100):null;return `<button data-lesson="${i}" class="lessonItem"><span>${i+1}. ${esc(l.title)}</span><small>${difficulty(i)}</small><small>${r?`Соңғы тест / Последний тест: ${pct}%`:state.best[i]!==undefined||state.completed.includes(i)?'Бұрын оқылған · соңғы баға жоқ / Изучался · последняя оценка неизвестна':'Тест әлі жоқ / Тест не пройден'}</small><progress max="100" value="${pct??0}" aria-label="Соңғы нәтиже / Последний результат"></progress></button>`}).join('')}</div>`,'lessons');app.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>startLesson(+b.dataset.lesson))}
function startLesson(i){state.session={mode:'cards',lesson:i,title:LESSONS[i].title,ids:LESSONS[i].words.map(w=>w.id),pos:0,flipped:false};save();renderSession()}
function startReview(ids,title){if(!ids.length){flash('Мұнда әзірге сөз жоқ. Келесі сабақты бастай аласың! / Здесь пока пусто. Можно начать следующий урок!');return}state.session={mode:'cards',lesson:-1,title,ids:ids.slice(0,10),pos:0,flipped:false};save();renderSession()}
function sessionTitle(s){return s.lesson>=0?LESSONS[s.lesson].title:'Қайталау / Повторение'}
function renderSession(){if(!state.session){home();return}const s=state.session;if(s.mode==='cards')cards();else if(s.mode==='quiz')quiz();else result()}
function fitCardText(){for(const id of ['cardText','cardTranslation']){const el=document.getElementById(id);if(!el||!el.parentElement?.clientHeight)continue;const box=el.parentElement;el.style.fontSize='36px';for(let size=36;size>14&&(el.scrollHeight>box.clientHeight-12||el.scrollWidth>box.clientWidth-12);size-=2)el.style.fontSize=(size-2)+'px'}}
function cards(){const s=state.session,w=word(s.ids[s.pos]);view(`<p class="stage">${esc(sessionTitle(s))} · ${s.pos+1} / ${s.ids.length}</p><progress max="${s.ids.length}" value="${s.pos+1}" aria-label="Карточкалар / Карточки"></progress><div class="mascotSlot" style="visibility:${s.pos%3===0?'visible':'hidden'}"><img decoding="async" src="${HERO}" alt=""><span>Бірге үйренеміз / Учимся вместе</span></div><div class="study-card"><button id="cardFace" class="flashcard" aria-describedby="cardHelp" aria-expanded="${!!s.flipped}"><span class="cardHalf"><span id="cardText" lang="kk">${esc(w.kk)}</span></span><span class="cardHalf translationHalf ${s.flipped?'revealed':''}" id="translationHalf" aria-hidden="${!s.flipped}"><span id="cardTranslation" lang="ru">${esc(w.ru)}</span></span></button><button id="flip" class="wide" aria-controls="translationHalf" aria-expanded="${!!s.flipped}">${s.flipped?'Жасыру / Скрыть перевод':'Аударма / Показать перевод'}</button></div><div class="row cardNav"><button id="back" ${s.pos===0?'disabled':''}>Артқа / Назад</button><button id="next" class="primary">${s.pos===s.ids.length-1?'Тестке / К тесту':'Келесі / Далее'}</button></div><p id="cardHelp" class="muted compactHelp">Карточканы бас / Нажми на карточку</p>`,'cards');const flip=()=>{s.flipped=!s.flipped;document.getElementById('translationHalf').classList.toggle('revealed',s.flipped);document.getElementById('translationHalf').setAttribute('aria-hidden',String(!s.flipped));document.getElementById('cardFace').setAttribute('aria-expanded',String(s.flipped));document.getElementById('flip').setAttribute('aria-expanded',String(s.flipped));document.getElementById('flip').textContent=s.flipped?'Жасыру / Скрыть перевод':'Аударма / Показать перевод';save()};on('cardFace',flip);on('flip',flip);on('back',()=>{s.pos--;s.flipped=false;save();cards()});on('next',()=>{if(s.pos===s.ids.length-1)beginQuiz();else{s.pos++;s.flipped=false;save();cards()}});fitCardText()}

function beginQuiz(){const s=state.session;Object.assign(s,{mode:'quiz',quizVersion:2,questions:makeQuestions(s.ids),pos:0,correct:0,first:[],tries:[],solved:false,options:null});save();quiz()}
function meanings(w){return w.ru.split(' / ').map(x=>norm(x.replace(/\([^)]*\)/g,'')))}
function optionsFor(q){const w=word(q.id),mw=meanings(w);const candidates=shuffle(allWords().filter(x=>x.id!==w.id&&!meanings(x).some(v=>mw.includes(v))));const used=new Set([q.dir?w.kk:w.ru]);const choices=[w.id];for(const x of candidates){let label=q.dir?x.kk:x.ru;if(!used.has(label)){choices.push(x.id);used.add(label)}if(choices.length===4)break}return shuffle(choices)}
function quiz(){const s=state.session;if(s.pos>=15){finish();return}const q=s.questions[s.pos],w=word(q.id);if(!s.options){s.options=optionsFor(q);save()}view(`<p class="stage">${esc(sessionTitle(s))} · ${s.pos+1} / 15</p><progress max="15" value="${s.pos}" aria-label="Тест"></progress><div class="card quizCard"><p class="quizInstruction">${q.dir?'Қазақша таңда / Выбери на казахском':'Орысша таңда / Выбери на русском'}</p><div class="quizPrompt" lang="${q.dir?'ru':'kk'}">${esc(q.dir?w.ru:w.kk)}</div><div class="quizResponse"><div class="grid quizChoices">${s.options.map(id=>{const tried=s.tries.includes(id),right=tried&&id===q.id;return `<button class="answer ${tried?(right?'answerRight':'answerWrong'):''}" data-answer="${id}" ${s.solved||tried?'disabled':''} lang="${q.dir?'kk':'ru'}">${tried?`<span aria-label="${right?'Дұрыс / Верно':'Қате / Неверно'}">${right?'✓':'✕'}</span> `:''}${esc(q.dir?word(id).kk:word(id).ru)}</button>`}).join('')}</div></div><p class="attemptStatus" role="status">${s.solved?'✓':s.tries.length?'Тағы таңда / Попробуй ещё':'Жауапты таңда / Выбери ответ'}</p></div><button id="continue" class="primary wide" ${s.first[s.pos]===undefined?'disabled':''}>Келесі / Далее</button><button id="toWords" class="wide">↩ Сөздерге / К словам урока</button>`,'quiz');app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.answer));on('continue',nextQuestion);on('toWords',()=>{s.mode='cards';s.pos=0;s.flipped=false;save();cards()})}



function answer(id){const s=state.session;if(s.mode!=='quiz'||s.solved||!s.options.includes(id)||s.tries.includes(id))return;const q=s.questions[s.pos];if(s.first[s.pos]===undefined){s.first[s.pos]=id;if(id===q.id)s.correct++;else if(!state.errors.includes(q.id))state.errors.push(q.id)}s.tries.push(id);s.solved=id===q.id;save();quiz()}
function finish(){const s=state.session;if(s.mode==='result'){result();return}s.mode='result';for(const id of s.ids){const indices=s.questions.map((q,i)=>q.id===id?i:-1).filter(i=>i>=0);if(!indices.length)continue;if(indices.every(i=>s.first[i]===id)){state.errors=state.errors.filter(x=>x!==id);if(!state.learned.includes(id))state.learned.push(id);state.due[id]=Date.now()+(s.lesson===-1?3:1)*86400000}else{state.learned=state.learned.filter(x=>x!==id);if(!state.errors.includes(id))state.errors.push(id)}}if(s.lesson>=0){state.last[s.lesson]={correct:s.correct,total:15};if(!state.completed.includes(s.lesson))state.completed.push(s.lesson)}save();result()}
function result(){const s=state.session;view(`<div class="card center"><div class="mascotSlot"><img decoding="async" src="${HERO}" alt=""><span>Нәтиже / Результат</span></div><h1>${Math.round(s.correct/15*100)}%</h1><p>${s.correct} / 15</p><p>Тек алғашқы жауап есептеледі.<br>Считается только первая попытка.</p><div class="row"><button id="again">Қайта / Ещё тест</button><button id="done" class="primary">Дайын / Готово</button></div><button id="resultWords">Сөздерге / К словам</button></div>`,'result');on('again',beginQuiz);on('resultWords',()=>{s.mode='cards';s.pos=0;s.flipped=false;save();cards()});on('done',()=>{state.session=null;save();home()})}
function dictionary(){view(`<h1>Сөздік / Словарь</h1><p>1000 сөз / слов · Өз сөздерім / Мои слова: ${state.custom.length}</p><label for="search">Сөз іздеу / Найти слово</label><input id="search" type="search" placeholder="Мысалы: алма немесе яблоко / Например: алма или яблоко"><div id="wordlist"></div><details><summary>Өз сөзіңді қосу / Добавить своё слово</summary><p>Аударманы ересек адамға тексерт. Қосқан сөздерің тек осы құрылғыда сақталады. / Попроси взрослого проверить перевод. Свои слова сохраняются только на этом устройстве.</p><form id="addForm"><label for="kk">Қазақша сөз / Слово на казахском</label><input id="kk" maxlength="100" required lang="kk"><label for="ru">Орысша аудармасы / Перевод на русский</label><input id="ru" maxlength="200" required><p id="formError" role="alert"></p><button class="primary" type="submit">Сөз қосу / Добавить слово</button></form></details><button id="customPractice">Өз сөздерімді үйрену · / Учить мои слова · ${state.custom.length}</button>`,'dictionary');const search=document.getElementById('search'),list=document.getElementById('wordlist');function draw(){let q=norm(search.value),matches=allWords().filter(w=>norm(w.kk+' '+w.ru).includes(q));list.innerHTML=`<p class="muted">Табылды: / Найдено: ${matches.length}.</p><table><tbody>${matches.map(w=>`<tr><td lang="kk">${esc(w.kk)}</td><td>${esc(w.ru)}</td></tr>`).join('')}</tbody></table>`}search.oninput=draw;draw();document.getElementById('addForm').onsubmit=e=>{e.preventDefault();const kk=document.getElementById('kk').value.trim(),ru=document.getElementById('ru').value.trim(),error=document.getElementById('formError');if(!kk||!ru){error.textContent='Екі жолды да толтыр. / Заполни оба поля.';return}if(allWords().some(w=>norm(w.kk)===norm(kk))){error.textContent='Бұл қазақша сөз сөздікте бар. / Такое казахское слово уже есть в словаре.';return}if(state.custom.length>=5000){error.textContent='Өз сөздеріңнің саны 5000-ға жетті. / Достигнут предел: 5000 своих слов.';return}state.custom.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2),kk,ru,lesson:-1});save();dictionary();flash('Сөз қосылды! / Слово добавлено!')};on('customPractice',()=>startReview(shuffle(state.custom.map(w=>w.id)),'Өз сөздерім / Мои слова'))}
function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function parents(){view(`<h1>Ата-анаға / Для родителей</h1><details><summary>Қалай үйренеміз? / Как заниматься</summary><p>Барлық 100 сабақ ашық. Әр сабақта 10 сөз, тестте 15 сұрақ бар. Екі бағыт та кездеседі. / Все 100 уроков доступны. В уроке 10 слов, в тесте 15 вопросов в обоих направлениях.</p><p>Аударма сөздің астында ашылады. Қате жауаптан кейін тағы таңдауға немесе келесі сұраққа өтуге болады. / Перевод открывается под словом. После ошибки можно попробовать ещё или перейти дальше.</p><p>Пайыз тек алғашқы жауаппен есептеледі. Сабақта соңғы аяқталған тесттің бағасы көрсетіледі. Бұрынғы ең жоғары баға соңғы баға болып саналмайды. / Процент считается по первой попытке. У урока показан последний завершённый тест. Старый максимум не выдаётся за последнюю оценку.</p><p>Ескі тест сеансы карточкалардан жалғасады; оқу нәтижелері сақталады. / Старый сеанс теста продолжается с карточек; накопленный прогресс сохраняется.</p><p>Қайталау: келесі күні, сәтті қайталасаң — үш күннен соң. / Повторение: на следующий день, после успешного повторения — через три дня.</p></details><div class="card"><h2>Осы құрылғыдағы оқу нәтижелері / Прогресс на этом устройстве</h2><p>Нәтижелер браузерде сақталады. Деректерді тазалау, жеке режим, басқа браузер немесе HTML файлын жылжыту сақтауға әсер етуі мүмкін. Көшірмені мезгіл-мезгіл жүктеп алып отырыңыз. / Он сохраняется в браузере. Очистка данных, приватный режим, другой браузер или перемещение HTML-файла могут повлиять на сохранение. Рекомендуем периодически скачивать копию.</p><button id="export" class="primary wide">Нәтижелер мен өз сөздерімді жүктеп алу / Скачать прогресс и свои слова</button><label for="import">Көшірмеден қалпына келтіру (.json) / Восстановить из копии (.json)</label><input id="import" type="file" accept=".json,application/json"><p id="importStatus" role="status"></p><button id="confirmImport" hidden>Қазіргі нәтижелерді осы көшірмемен ауыстыру / Заменить текущий прогресс этой копией</button></div><div class="card"><h2>Сөздік туралы / О словаре</h2><p>Бұл — тақырыптарға бөлінген 1000 қазақша сөз. Жиілік бойынша жасалған рейтинг емес. Алдымен отбасы, мектеп және тұрмыс сөздері, кейін іс-әрекеттер мен күрделірек ұғымдар беріледі. Көп қолданылатын кірме сөздер де бар. Көпмағыналы сөздердің негізгі мағыналары көрсетілген. / Это тематический учебный набор из 1000 разных казахских слов, а не статистический рейтинг частотности. Сначала — семья, школа и быт; затем действия и более сложные понятия. Включены общеупотребительные заимствования. У многозначных слов приведены основные учебные значения.</p><p>Кейбір сөздер тексерілген дереккөздер: / Выборочная сверка: <a href="https://sozdikqor.kz/soz?a=S%C4%B0%C5%83L%C4%B0&id=177941" target="_blank" rel="noopener">Sozdikqor: сіңлі</a>; <a href="https://www.soyle.kz/upload/orig/article/347676_1467047604.pdf" target="_blank" rel="noopener">Soyle: көкөністер мен жемістер / Soyle: овощи и фрукты</a>; <a href="https://e-history.kz/ru/kazakhstanika/show/10783" target="_blank" rel="noopener">Сырнай</a>. Барлық 1000 аударма тәуелсіз редактордың толық тексеруінен өткен жоқ. / Полная независимая редакторская проверка всех 1000 переводов не проводилась.</p></div><details><summary>Телефонда қалай ашуға болады / Как открыть на телефоне</summary><p>Ашыңыз: / Откройте <a href="https://rustemarenov-source.github.io/aruzhan-kazakh/">қосымшаның сілтемесі / приложение по ссылке</a> Safari немесе басқа браузерде. Нәтижелер құрылғыда сақталады. Басқа құрылғыға көшіру үшін осы бөлімдегі JSON көшірмесін қолданыңыз. / в Safari или другом браузере. Прогресс хранится на устройстве. Для переноса используйте копию JSON из этого раздела.</p><p>Жеке HTML файлы — қосымшаның сақтық көшірмесі. Оның ішінде барлық сөздер мен сурет бар. JavaScript қолдайтын браузер қажет. Кейбір телефондардағы файлды алдын ала қарау режимі қосымшаны іске қоспайды. / Самостоятельный HTML-файл — резервная копия приложения. Он содержит все слова и иллюстрацию; для работы требуется браузер с поддержкой JavaScript. Предпросмотр файлов на некоторых телефонах не запускает приложение.</p></details>`);on('export',()=>download('aruzhan-progress.json',JSON.stringify(state,null,2),'application/json'));let pending=null;document.getElementById('import').onchange=async e=>{const file=e.target.files[0],msg=document.getElementById('importStatus'),btn=document.getElementById('confirmImport');btn.hidden=true;pending=null;if(!file)return;try{if(file.size>3000000)throw Error('Файл тым үлкен / Файл слишком большой');pending=validateState(JSON.parse(await file.text()));msg.textContent=`Көшірмеде: / В копии: ${pending.completed.length} сабақ, / уроков, ${pending.custom.length} өз сөзің бар. Қазіргі деректер ауыстырылады. / своих слов. Текущие данные будут заменены.`;btn.hidden=false}catch(err){msg.textContent='Көшірмені оқу мүмкін болмады: / Не удалось прочитать копию: '+err.message}};on('confirmImport',()=>{if(pending){state=pending;save();home();flash('Оқу нәтижелері қалпына келтірілді. / Прогресс восстановлен.')}})}
function difficulty(i){return i<40?'Бастапқы / Начальный':i<75?'Орташа / Средний':'Күрделірек / Сложнее'}
function makeQuestions(ids){const shuffled=shuffle(ids),primary=shuffled.map((id,i)=>({id,dir:i%2}));let pool=shuffle(primary.concat(shuffle(primary.map(q=>({id:q.id,dir:1-q.dir}))).slice(0,Math.max(0,15-primary.length))));while(pool.length<15)pool.push(...shuffle(ids.flatMap(id=>[{id,dir:0},{id,dir:1}])).slice(0,15-pool.length));return shuffle(pool.slice(0,15))}
function nextQuestion(){const s=state.session;if(s.first[s.pos]===undefined)return;s.pos++;s.tries=[];s.solved=false;s.options=null;save();quiz()}
function restoreSession(s){if(validSession(s))return s;if(s&&s.quizVersion!==2&&['quiz','result'].includes(s.mode)){const cards={mode:'cards',lesson:s.lesson,ids:s.ids,pos:0,flipped:false};if(validSession(cards))return cards}return null}
if(window.addEventListener)window.addEventListener('resize',fitCardText);
document.getElementById('homeBtn').onclick=home;home();
</script></body></html>
